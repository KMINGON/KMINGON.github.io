baseURL = 'https://kmingon.github.io/'
languageCode = 'ko-KR'
defaultContentLanguage = 'ko'   # <html lang="ko"> — 미설정 시 en으로 렌더링됨
title = '보안 연구 노트'
enableRobotsTXT = true          # layouts/robots.txt 로 Sitemap 지시자 노출

[module]
  # uncomment line below for temporary local development of module
  # replacements = "github.com/lxndrblz/anatole -> ../../anatole"
  [[module.imports]]
    path = "github.com/lxndrblz/anatole"
    disable = false


[params]
title = "RTCat's Lab"   # 사이드바 타이틀(사이트 title과 별개)
author = "RTCat"
description = "보안 학습 과정에서 얻은 인사이트 저장소"
profilePicture = "images/4.png"
mainSections = ["review", "analysis", "note", "playbook"]  # 홈에 주요 섹션 글 노출
readMore = true # 가볍게 요약 정렬
gtagId = "G-GGY59YGHKJ"
customCss = ["css/custom.css"]  # 인라인 코드 강조 등 커스텀 스타일
contentratio = 0.70  # 본문 66% / 사이드바 34% (기본 0.6). 클수록 사이드바가 좁아짐

[[params.socialIcons]]
icon = "fab fa-github"
title = "GitHub"
url = "https://github.com/KMINGON"



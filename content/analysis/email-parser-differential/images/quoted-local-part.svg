<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">Quoted local-part의 주소 경계</title>
<desc id="desc">입력: &quot;reader@outside.example x&quot;@company.example。문법에 따른 해석：company.example。취약한 Nodemailer：따옴표 내부를 수신자로 해석。company.example 기준으로：도메인 검사 통과。outside.example로：인증 메일 전송</desc>
<rect width="960" height="610" fill="#ffffff"/>

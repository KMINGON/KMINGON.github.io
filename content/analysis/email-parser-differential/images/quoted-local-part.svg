<polygon points="235,420 230,409 240,409" fill="#555555"/>
<path d="M725 339 L725 420" fill="none" stroke="#555555" stroke-width="1.5"/>
<polygon points="725,420 720,409 730,409" fill="#555555"/>
<rect x="50" y="75" width="860" height="78" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
<rect x="40" y="235" width="390" height="104" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
<rect x="530" y="235" width="390" height="104" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
<rect x="40" y="420" width="390" height="86" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
<rect x="530" y="420" width="390" height="86" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" text-anchor="middle">
<text x="480" y="40.9" font-size="24" fill="#222222">Quoted local-part의 주소 경계</text>
<text x="480" y="289.8" font-size="28" fill="#a34444">≠</text>
<text x="480" y="576.65" font-size="19" fill="#444444">따옴표 내부의 주소와 바깥 도메인을 서로 다른 수신자로 해석한다.</text>
<text x="480" y="121" font-size="20" fill="#222222">입력: &quot;reader@outside.example x&quot;@company.example</text>
<text x="235" y="279.5" font-size="20" fill="#222222">문법에 따른 해석</text>
<text x="235" y="308.5" font-size="20" fill="#222222">company.example</text>
<text x="725" y="279.5" font-size="20" fill="#222222">취약한 Nodemailer</text>
<text x="725" y="308.5" font-size="20" fill="#222222">따옴표 내부를 수신자로 해석</text>
<text x="235" y="455.5" font-size="20" fill="#222222">company.example 기준으로</text>
<text x="235" y="484.5" font-size="20" fill="#222222">도메인 검사 통과</text>
<text x="725" y="455.5" font-size="20" fill="#222222">outside.example로</text>
<text x="725" y="484.5" font-size="20" fill="#222222">인증 메일 전송</text>
</g></svg>

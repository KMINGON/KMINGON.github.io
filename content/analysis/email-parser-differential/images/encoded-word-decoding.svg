<rect x="530" y="420" width="390" height="86" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" text-anchor="middle">
<text x="480" y="40.9" font-size="24" fill="#222222">Encoded-word 디코딩 전후의 해석</text>
<text x="480" y="289.8" font-size="28" fill="#a34444">≠</text>
<text x="480" y="576.65" font-size="19" fill="#444444">디코딩 전의 검증이 달라진 결과에도 적용된다고 가정한다.</text>
<text x="480" y="121" font-size="20" fill="#222222">비정상적인 encoded-word가 포함된 헤더</text>
<text x="235" y="279.5" font-size="20" fill="#222222">원문을 검사하는 검증기</text>
<text x="235" y="308.5" font-size="20" fill="#222222">디코딩 전 주소로 판단</text>
<text x="725" y="279.5" font-size="20" fill="#222222">취약한 Q/B 디코더</text>
<text x="725" y="308.5" font-size="20" fill="#222222">일부 텍스트 누락·경계 변경</text>
<text x="235" y="455.5" font-size="20" fill="#222222">표현 A</text>
<text x="235" y="484.5" font-size="20" fill="#222222">표시·인가에 대한 검증</text>
<text x="725" y="455.5" font-size="20" fill="#222222">표현 B</text>
<text x="725" y="484.5" font-size="20" fill="#222222">다른 주소로 표시·처리</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">Encoded-word 디코딩 전후의 해석</title>
<desc id="desc">비정상적인 encoded-word가 포함된 헤더。원문을 검사하는 검증기：디코딩 전 주소로 판단。취약한 Q/B 디코더：일부 텍스트 누락·경계 변경。표현 A：표시·인가에 대한 검증。표현 B：다른 주소로 표시·처리</desc>

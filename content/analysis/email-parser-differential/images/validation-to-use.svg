<text x="480" y="40.9" font-size="24" fill="#222222">검증 이후 표현이 바뀌는 지점</text>
<text x="480" y="602.65" font-size="19" fill="#444444">표현 A에 대한 검증 결과가 표현 B에도 유효한가?</text>
<text x="480" y="104" font-size="20" fill="#222222">입력</text>
<text x="480" y="207.5" font-size="20" fill="#222222">표현 A</text>
<text x="480" y="236.5" font-size="20" fill="#222222">주소 해석·보안 판단</text>
<text x="480" y="347.5" font-size="20" fill="#222222">디코딩·정규화</text>
<text x="480" y="376.5" font-size="20" fill="#222222">오류 복구·재파싱</text>
<text x="480" y="487.5" font-size="20" fill="#222222">표현 B</text>
<text x="480" y="516.5" font-size="20" fill="#222222">메일 전송·주소 표시·인가</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
<title id="title">메일 헤더와 SMTP 수신자</title>
<desc id="desc">입력 주소。애플리케이션의 도메인 검사。메일 라이브러리：주소 해석·변환。To: 헤더：화면에 표시되는 주소。SMTP Envelope：전송에 사용하는 수신자。RCPT TO → 메일 서버</desc>

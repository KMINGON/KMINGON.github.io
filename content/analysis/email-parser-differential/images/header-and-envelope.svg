<text x="480" y="40.9" font-size="24" fill="#222222">메일 헤더와 SMTP 수신자</text>
<text x="480" y="690.65" font-size="19" fill="#444444">To: 헤더만으로 실제 SMTP 수신자를 확정할 수 없다.</text>
<text x="480" y="104" font-size="20" fill="#222222">입력 주소</text>
<text x="480" y="211" font-size="20" fill="#222222">애플리케이션의 도메인 검사</text>
<text x="480" y="316.5" font-size="20" fill="#222222">메일 라이브러리</text>
<text x="480" y="345.5" font-size="20" fill="#222222">주소 해석·변환</text>
<text x="235" y="472.5" font-size="20" fill="#222222">To: 헤더</text>
<text x="235" y="501.5" font-size="20" fill="#222222">화면에 표시되는 주소</text>
<text x="725" y="472.5" font-size="20" fill="#222222">SMTP Envelope</text>
<text x="725" y="501.5" font-size="20" fill="#222222">전송에 사용하는 수신자</text>
<text x="725" y="618" font-size="20" fill="#222222">RCPT TO → 메일 서버</text>
</g></svg>

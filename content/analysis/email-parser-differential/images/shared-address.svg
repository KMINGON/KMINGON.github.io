<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" text-anchor="middle">
<text x="480" y="40.9" font-size="24" fill="#222222">같은 주소로 검증하고 전송하는 흐름</text>
<text x="733" y="431.95" font-size="17" fill="#444444">불허</text>
<text x="531" y="530.95" font-size="17" fill="#444444">허용</text>
<text x="480" y="691.65" font-size="19" fill="#444444">검증에 사용한 주소의 의미를 실제 전송 단계까지 유지한다.</text>
<text x="480" y="104" font-size="20" fill="#222222">입력</text>
<text x="480" y="202.5" font-size="20" fill="#222222">문맥에 맞는 파싱·정규화</text>
<text x="480" y="231.5" font-size="20" fill="#222222">오류·남은 입력 검사</text>
<text x="480" y="325" font-size="20" fill="#222222">구조화된 주소</text>
<text x="480" y="354" font-size="20" fill="#222222">local-part + domain</text>
<text x="480" y="445" font-size="20" fill="#222222">동일한 주소로</text>
<text x="480" y="474" font-size="20" fill="#222222">도메인 정책 검사</text>
<text x="855" y="445" font-size="20" fill="#222222">거절</text>
<text x="855" y="474" font-size="20" fill="#222222">전송 중단</text>
<text x="480" y="592.5" font-size="20" fill="#222222">허용한 주소로 수신자 구성</text>
<text x="480" y="621.5" font-size="20" fill="#222222">SMTP Envelope 일치 확인</text>
</g></svg>

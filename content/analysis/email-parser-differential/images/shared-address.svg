<svg xmlns="http://www.w3.org/2000/svg" width="960" height="710" viewBox="0 0 960 710" role="img" aria-labelledby="title desc">
<title id="title">같은 주소로 검증하고 전송하는 흐름</title>
<desc id="desc">입력。문맥에 맞는 파싱·정규화：오류·남은 입력 검사。구조화된 주소：local-part + domain。동일한 주소로：도메인 정책 검사。거절：전송 중단。허용한 주소로 수신자 구성：SMTP Envelope 일치 확인</desc>

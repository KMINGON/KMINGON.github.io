<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">도메인 전처리와 Punycode 인코딩</title>
<desc id="desc">Unicode 도메인。UTS #46 처리：매핑·정규화·유효성 검사。Punycode 인코딩만 수행：호환성 전처리 생략。처리 정책에 맞는：ASCII 도메인。다른 ASCII 표현：생성 가능</desc>

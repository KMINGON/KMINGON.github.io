<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" text-anchor="middle">
<text x="480" y="40.9" font-size="24" fill="#222222">도메인 전처리와 Punycode 인코딩</text>
<text x="480" y="289.8" font-size="28" fill="#a34444">≠</text>
<text x="480" y="576.65" font-size="19" fill="#444444">문자 인코딩과 도메인 처리 정책을 구분해야 한다.</text>
<text x="480" y="121" font-size="20" fill="#222222">Unicode 도메인</text>
<text x="235" y="279.5" font-size="20" fill="#222222">UTS #46 처리</text>
<text x="235" y="308.5" font-size="20" fill="#222222">매핑·정규화·유효성 검사</text>
<text x="725" y="279.5" font-size="20" fill="#222222">Punycode 인코딩만 수행</text>
<text x="725" y="308.5" font-size="20" fill="#222222">호환성 전처리 생략</text>
<text x="235" y="455.5" font-size="20" fill="#222222">처리 정책에 맞는</text>
<text x="235" y="484.5" font-size="20" fill="#222222">ASCII 도메인</text>
<text x="725" y="455.5" font-size="20" fill="#222222">다른 ASCII 표현</text>
<text x="725" y="484.5" font-size="20" fill="#222222">생성 가능</text>
</g></svg>

<text x="215.0" y="365.0" font-size="19" font-weight="700" text-anchor="middle" fill="#243347">② 실패한 테스트 실행 요청</text>
<text x="215.0" y="391.0" font-size="16" font-weight="400" text-anchor="middle" fill="#243347">run_command(...)</text>

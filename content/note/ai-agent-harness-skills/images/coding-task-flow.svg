<text x="480.0" y="923.0" font-size="19" font-weight="700" text-anchor="middle" fill="#243347">⑥ 모델이 변경 내용과 검증 결과를 보고하고 Harness가 종료 처리</text>
<text x="480" y="979" font-size="17" font-weight="400" text-anchor="middle" fill="#243347">관찰 결과에 따라 다음 행동을 고르는 반복이 Agent의 동작을 이룬다.</text>
<text x="480" y="1006" font-size="15" font-weight="400" text-anchor="middle" fill="#667383">설명용 흐름 · 중간 호출은 달라질 수 있음 · Hook은 앞서 제시한 Claude Code 설정을 가정</text>

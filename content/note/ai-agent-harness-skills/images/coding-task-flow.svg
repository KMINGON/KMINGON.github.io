<text x="550" y="728" font-size="15" font-weight="400" text-anchor="start" fill="#49785c">결과 → 다음 입력</text>
<rect x="40" y="756" width="350" height="82" rx="8" fill="#edf4fb" stroke="#416b96" stroke-width="1.5"/>
<text x="215.0" y="797.0" font-size="19" font-weight="700" text-anchor="middle" fill="#243347">⑤ 수정 후 같은 테스트 재실행</text>
<text x="215.0" y="823.0" font-size="16" font-weight="400" text-anchor="middle" fill="#243347">run_command(...)</text>
<rect x="535" y="756" width="385" height="82" rx="8" fill="#fff5e9" stroke="#aa753c" stroke-width="1.5"/>

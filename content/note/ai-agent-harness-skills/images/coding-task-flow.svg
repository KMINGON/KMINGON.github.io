<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1030" viewBox="0 0 960 1030" role="img" aria-labelledby="title desc">
<title id="title">로그인 테스트 수정 요청이 실행되는 과정</title><desc id="desc">모델이 이슈 조회, 테스트 실행, 코드 확인, 수정과 재검증을 선택한다. Harness는 도구를 실행하고 관찰 결과를 다음 호출에 전달한다. 설정된 Claude Code Hook은 파일 수정 뒤 포맷터를 실행한다.</desc>
<rect width="960" height="1030" fill="#ffffff"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif" fill="#243347">
<text x="40" y="44" font-size="25" font-weight="700" text-anchor="start" fill="#243347">로그인 테스트 수정 요청이 실행되는 과정</text>
<rect x="40" y="68" width="880" height="58" rx="8" fill="#f6f7f9" stroke="#707988" stroke-width="1.5"/>
<text x="480" y="94" font-size="19" font-weight="700" text-anchor="middle" fill="#243347">“이슈 #42를 확인하고 실패하는 로그인 테스트를 고쳐줘.”</text>
<text x="480" y="116" font-size="15" font-weight="400" text-anchor="middle" fill="#243347">요청 + 프로젝트 지침 + 필요한 Skill + 사용 가능한 도구</text>
<text x="215" y="158" font-size="18" font-weight="700" text-anchor="middle" fill="#243347">모델 · 받은 정보로 다음 행동 선택</text>
<text x="730" y="158" font-size="18" font-weight="700" text-anchor="middle" fill="#243347">Harness · 도구 실행과 결과 반영</text>
<rect x="40" y="184" width="350" height="82" rx="8" fill="#edf4fb" stroke="#416b96" stroke-width="1.5"/>
<text x="215.0" y="225.0" font-size="19" font-weight="700" text-anchor="middle" fill="#243347">① 재현 조건 조회 요청</text>
<text x="215.0" y="251.0" font-size="16" font-weight="400" text-anchor="middle" fill="#243347">get_issue(42)</text>
<rect x="535" y="184" width="385" height="82" rx="8" fill="#fff5e9" stroke="#aa753c" stroke-width="1.5"/>
<text x="727.5" y="225.0" font-size="19" font-weight="700" text-anchor="middle" fill="#243347">MCP Client → Server → 이슈 API</text>
<text x="727.5" y="251.0" font-size="16" font-weight="400" text-anchor="middle" fill="#243347">이슈의 재현 조건 반환</text>

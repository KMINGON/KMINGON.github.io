<text x="215.0" y="677.0" font-size="16" font-weight="400" text-anchor="middle" fill="#243347">수정할 경로와 변경 내용</text>
<rect x="535" y="604" width="385" height="94" rx="8" fill="#fff5e9" stroke="#aa753c" stroke-width="1.5"/>

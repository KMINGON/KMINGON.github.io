<text x="550" y="576" font-size="15" font-weight="400" text-anchor="start" fill="#49785c">결과 → 다음 입력</text>
<rect x="40" y="604" width="350" height="94" rx="8" fill="#edf4fb" stroke="#416b96" stroke-width="1.5"/>

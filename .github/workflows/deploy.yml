name: Deploy Hugo site to Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) 코드
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache project toolchain and modules
        uses: actions/cache@v4
        with:
          path: |
            .cache/toolchain
            .cache/go
            .cache/go-build
            .cache/hugo
          key: ${{ runner.os }}-blog-toolchain-${{ hashFiles('scripts/setup.sh', 'go.mod', 'go.sum') }}

      - name: Set up project toolchain
        run: bash scripts/setup.sh

      - name: Check project toolchain
        run: bash scripts/check-toolchain.sh

      # 5) (선택) 환경 출력: 어떤 트랜스파일러가 잡혔는지 확인 가능
      - name: Hugo env
        run: bash scripts/run.sh hugo env

      # 6) 빌드
      - name: Build
        run: bash scripts/run.sh hugo --minify

      - name: Check analytics and consent
        run: bash scripts/run.sh node scripts/check-analytics.mjs public

      # 7) Pages 아티팩트 업로드(전용)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

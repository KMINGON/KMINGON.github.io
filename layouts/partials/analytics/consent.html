<section id="analytics-consent" class="analytics-consent" aria-labelledby="analytics-consent-title" hidden>
  <h2 id="analytics-consent-title" tabindex="-1">Google 방문 통계</h2>
  <p>허용하면 Google Analytics 쿠키로 글을 읽는 흐름을 분석합니다. 허용하지 않아도 모든 글을 읽을 수 있으며, 선택은 언제든 바꿀 수 있습니다. Cloudflare 기본 통계는 별도로 운영하며 <a href="{{ "privacy/#basic-analytics" | relURL }}">기본 통계 설정</a>에서 끌 수 있습니다.</p>
  <div class="analytics-consent__actions">
    <button type="button" data-analytics-choice="denied">Google 통계 허용 안 함</button>
    <button type="button" data-analytics-choice="granted">Google 통계 허용</button>
    <a href="{{ "privacy/" | relURL }}">개인정보 안내</a>
  </div>
</section>

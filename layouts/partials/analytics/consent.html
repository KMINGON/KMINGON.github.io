<section id="analytics-consent" class="analytics-consent" aria-labelledby="analytics-consent-title" hidden>
  <h2 id="analytics-consent-title" tabindex="-1">방문 통계 수집</h2>
  <p>글을 읽는 흐름을 파악하기 위해 Google Analytics 쿠키를 사용합니다. 허용하지 않아도 모든 글을 읽을 수 있으며, 선택은 언제든 바꿀 수 있습니다.</p>
  <div class="analytics-consent__actions">
    <button type="button" data-analytics-choice="denied">허용 안 함</button>
    <button type="button" data-analytics-choice="granted">허용</button>
    <a href="{{ "privacy/" | relURL }}">개인정보 안내</a>
  </div>
</section>
